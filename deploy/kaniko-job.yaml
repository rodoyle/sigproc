# Kaniko Job: builds the sigproc CAPTURE Dockerfile and pushes to GHCR
#
# Workspace layout: the capture image is built from capture/Dockerfile, which
# builds only the `sigproc` workspace member. The channelizer/fixture/sink
# members have their own Dockerfiles (they need no UHD).
#
# Runs on any arm64 node. Clones the repo, builds via kaniko, pushes to
# ghcr.io/rodoyle/sigproc:latest. Requires the `ghcr-push` secret in the
# `build` namespace (docker config.json format).
#
# Performance notes (rpi-four-2 has a slow SD card):
#   --snapshot-mode=redo   only re-hash files whose mtime changed instead of
#                          hashing the whole filesystem after every RUN step
#                          (default `full` mode was the dominant build cost)
#   --kaniko-dir           kaniko scratch (layer tarballs) on the SMB-backed
#                          PVC so bulk writes skip the SD card
#
# SMB caveats (why this job looks the way it does):
#   * CIFS has no native symlinks, so the PVC's StorageClass adds the
#     `mfsymlinks` mount option. Without it kaniko fails with
#     "symlink ... operation not supported".
#   * Kaniko chowns/rewrites $KANIKO_DIR/.docker, which a read-only secret
#     mount cannot satisfy ("chown ... read-only file system"). So the
#     credentials are copied onto the writable SMB volume by an init
#     container instead of being mounted read-only into kaniko.
#
# Apply the PVC first:  kubectl apply -f deploy/kaniko-scratch-pvc.yaml
# Apply the job:        kubectl apply -f deploy/kaniko-job.yaml
# Follow the build:     kubectl -n build logs job/kaniko-build-sigproc -f
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build-sigproc
  namespace: build
  labels:
    app: sigproc
    type: kaniko-build
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      # Target any arm64 node for native build
      nodeSelector:
        kubernetes.io/arch: arm64
      restartPolicy: Never
      initContainers:
        # ── Clone the sigproc repo ──────────────────────────────────────
        - name: git-clone
          image: alpine/git:latest
          command:
            - sh
            - -c
            - |
              git clone https://github.com/rodoyle/sigproc.git /workspace
              echo "Cloned sigproc repo to /workspace"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
        # ── Stage registry credentials on the writable SMB scratch ─────
        - name: stage-kaniko-creds
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              mkdir -p /kaniko-scratch/.docker
              cp /secret/.dockerconfigjson /kaniko-scratch/.docker/config.json
              chmod 0600 /kaniko-scratch/.docker/config.json
              echo "Staged kaniko docker config"
          volumeMounts:
            - name: kaniko-secret
              mountPath: /secret
              readOnly: true
            - name: kaniko-scratch
              mountPath: /kaniko-scratch
      containers:
        # ── Build with kaniko and push to GHCR ─────────────────────────
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --context=dir:///workspace
            - --dockerfile=capture/Dockerfile
            - --destination=ghcr.io/rodoyle/sigproc:latest
            - --cache=true
            - --cache-ttl=24h
            # Faster snapshots: only re-hash mtime-changed files
            - --snapshot-mode=redo
            # Kaniko scratch on SMB instead of the Pi's SD card
            - --kaniko-dir=/kaniko-scratch
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: kaniko-scratch
              mountPath: /kaniko-scratch
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "3000m"
      volumes:
        - name: workspace
          emptyDir: {}
        - name: kaniko-secret
          secret:
            secretName: ghcr-push
            items:
              - key: .dockerconfigjson
                path: .dockerconfigjson
        - name: kaniko-scratch
          persistentVolumeClaim:
            claimName: kaniko-scratch
