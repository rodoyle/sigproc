# Deployment: standing verification consumer.
#
# Named `vita49-sink-standing` rather than `vita49-sink` on purpose: the gate's
# own consumer is a Job named `vita49-sink` (the name the verification contract
# uses), and a Deployment and a Job of the same name in one namespace is legal
# but reads badly in `kubectl get all` and in `kubectl logs deploy/...`.
#
# The pod label stays `app: vita49-sink` so the vita49-sink Service selects it.
#
# The chain has to terminate in something that can say whether the stream is
# healthy. Until the demod microservice exists, this sink is that terminus: it
# parses the narrowband VITA49 with the shared parser and logs a verdict line
# every 30 seconds, so `kubectl logs deploy/vita49-sink` answers "is the channel
# still arriving, and is it still contiguous?" without shelling into a pod.
#
# It is deliberately NOT a probe-only pod: `--duration 0 --idle-exit-secs 0`
# means "never exit", because a consumer that dies when the producer pauses
# would restart-loop exactly when the stream is being diagnosed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vita49-sink-standing
  namespace: default
  labels:
    app: vita49-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vita49-sink
  template:
    metadata:
      labels:
        app: vita49-sink
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      # Keep the consumer off the node running the live B210 capture: it is
      # light, but the capture node holds a real-time USB stream open.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: sigproc
                topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: sink
          image: ghcr.io/rodoyle/sigproc-sink:latest
          imagePullPolicy: Always
          args:
            - --listen=0.0.0.0:4920
            - --expect-rate=50000
            - --duration=0
            - --idle-exit-secs=0
            - --report-interval=30
          env:
            - name: RUST_LOG
              value: info
          ports:
            - name: vita49-in
              containerPort: 4920
              protocol: UDP
          # A UDP consumer has no endpoint to probe, so this proves the binary
          # is alive. Stream health is in the periodic log line.
          livenessProbe:
            exec:
              command: ["/usr/local/bin/vita49-sink", "--version"]
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "1000m"
