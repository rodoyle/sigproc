# Kaniko Job: builds and pushes the three UHD-free service images.
#
#   channelizer/Dockerfile -> ghcr.io/rodoyle/sigproc-channelizer:latest
#   fixture/Dockerfile     -> ghcr.io/rodoyle/sigproc-fixture:latest
#   sink/Dockerfile        -> ghcr.io/rodoyle/sigproc-sink:latest
#
# One Job for all three because they share the expensive parts: the repo clone
# and the scratch volume. The dependency-cooking layers are cached in the
# registry between runs.
#
# Why these are initContainers: the kaniko executor image is scratch-based and
# contains only /kaniko/executor — there is no shell in it, so a single
# `sh -c "... && ... && ..."` container is impossible (it fails with
# `stat /busybox/sh: no such file or directory`). Init containers run
# sequentially and share volumes, so each image gets its own kaniko container
# with the image's own entrypoint and only `args` supplied.
#
# The capture image (which DOES need UHD) keeps its own Job:
# deploy/kaniko-job.yaml. Splitting them means a change to the channelizer
# can no longer invalidate or break the image that must keep the radio
# streaming.
#
# Apply:  kubectl apply -f deploy/kaniko-channelizer-job.yaml
# Follow: kubectl -n build logs job/kaniko-build-sigproc-chain -f
# Re-run: kubectl -n build delete job kaniko-build-sigproc-chain
#
# NOTE: this Job clones https://github.com/rodoyle/sigproc.git, so it builds
# what is PUSHED, not what is in the working tree.
#
# Deviation from the verification contract, recorded deliberately: the contract
# named the Job `kaniko-sigproc-channelizer` and covered one image. One Job now
# builds the three UHD-free images, because the clone and the scratch volume are
# the shared expensive parts, so the gate command is
# `kubectl wait --for=condition=complete
# job/kaniko-build-sigproc-chain` instead.
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build-sigproc-chain
  namespace: build
  labels:
    app: sigproc
    type: kaniko-build
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      # Prefer NOT the node running the live B210 capture: a cargo-chef cook is
      # heavy and the capture node is holding a real-time USB stream, and the
      # SMB-backed scratch PVC has no node affinity, so any arm64 node can host
      # this build.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["rpi-four-2"]
      restartPolicy: Never
      initContainers:
        # ── Clone the sigproc repo ──────────────────────────────────────
        - name: git-clone
          image: alpine/git:latest
          command:
            - sh
            - -c
            - |
              REPO=https://github.com/rodoyle/sigproc.git
              git clone --depth 1 "$REPO" /workspace
              echo "Cloned sigproc repo to /workspace"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
        # ── Stage registry credentials on the writable SMB scratch ─────
        # Kaniko rewrites $KANIKO_DIR/.docker, which a read-only secret mount
        # cannot satisfy ("chown ... read-only file system"), so the credentials
        # are copied onto the writable volume instead of mounted into kaniko.
        - name: stage-kaniko-creds
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              mkdir -p /kaniko-scratch/.docker
              cp /secret/.dockerconfigjson /kaniko-scratch/.docker/config.json
              chmod 0600 /kaniko-scratch/.docker/config.json
              echo "Staged kaniko docker config"
          volumeMounts:
            - name: kaniko-secret
              mountPath: /secret
              readOnly: true
            - name: kaniko-scratch
              mountPath: /kaniko-scratch
        # ── The three builds, sequentially, sharing clone + scratch ─────
        - name: build-channelizer
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --context=dir:///workspace
            - --dockerfile=channelizer/Dockerfile
            - --destination=ghcr.io/rodoyle/sigproc-channelizer:latest
            - --cache=true
            - --cache-ttl=24h
            - --snapshot-mode=redo
            - --kaniko-dir=/kaniko-scratch
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: kaniko-scratch
              mountPath: /kaniko-scratch
        - name: build-fixture
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --context=dir:///workspace
            - --dockerfile=fixture/Dockerfile
            - --destination=ghcr.io/rodoyle/sigproc-fixture:latest
            - --cache=true
            - --cache-ttl=24h
            - --snapshot-mode=redo
            - --kaniko-dir=/kaniko-scratch
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: kaniko-scratch
              mountPath: /kaniko-scratch
        - name: build-sink
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --context=dir:///workspace
            - --dockerfile=sink/Dockerfile
            - --destination=ghcr.io/rodoyle/sigproc-sink:latest
            - --cache=true
            - --cache-ttl=24h
            - --snapshot-mode=redo
            - --kaniko-dir=/kaniko-scratch
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: kaniko-scratch
              mountPath: /kaniko-scratch
      containers:
        # A pod needs a main container; the work is all in the init containers.
        - name: report
          image: busybox:latest
          command:
            - sh
            - -c
            - echo "all three images built and pushed"
      volumes:
        - name: workspace
          emptyDir: {}
        - name: kaniko-secret
          secret:
            secretName: ghcr-push
            items:
              - key: .dockerconfigjson
                path: .dockerconfigjson
        - name: kaniko-scratch
          persistentVolumeClaim:
            claimName: kaniko-scratch
