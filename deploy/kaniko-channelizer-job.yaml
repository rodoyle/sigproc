# Kaniko Job: builds and pushes the three UHD-free service images.
#
#   channelizer/Dockerfile -> ghcr.io/rodoyle/sigproc-channelizer:latest
#   fixture/Dockerfile     -> ghcr.io/rodoyle/sigproc-fixture:latest
#   sink/Dockerfile        -> ghcr.io/rodoyle/sigproc-sink:latest
#
# One Job for all three because they share everything expensive about a kaniko
# run: the repo clone and the scratch volume. Only the last stage of each build
# differs, and the dependency-cooking layers are cached in the registry between
# runs.
#
# The capture image (which DOES need UHD) keeps its own Job:
# deploy/kaniko-job.yaml. Splitting them means a change to the channelizer
# can no longer invalidate or break the image that must keep the radio
# streaming.
#
# Runs in the `build` namespace with the same SMB-scratch arrangement as
# kaniko-job.yaml — see that file for the CIFS/symlink and credential-staging
# caveats, which apply identically here.
#
# Apply:  kubectl apply -f deploy/kaniko-channelizer-job.yaml
# Follow: kubectl -n build logs job/kaniko-build-sigproc-chain -f
# Re-run: kubectl -n build delete job kaniko-build-sigproc-chain
#
# NOTE: this Job clones https://github.com/rodoyle/sigproc.git, so it builds
# what is PUSHED, not what is in the working tree.
#
# Deviation from the verification contract, recorded deliberately: the contract
# named the Job `kaniko-sigproc-channelizer` and covered one image. One Job now
# builds the three UHD-free images, because the clone and the scratch volume are
# the expensive shared parts, so the gate command is
# `kubectl wait --for=condition=complete
# job/kaniko-build-sigproc-chain` instead.
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build-sigproc-chain
  namespace: build
  labels:
    app: sigproc
    type: kaniko-build
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      restartPolicy: Never
      initContainers:
        # ── Clone the sigproc repo ──────────────────────────────────────
        - name: git-clone
          image: alpine/git:latest
          command:
            - sh
            - -c
            - |
              REPO=https://github.com/rodoyle/sigproc.git
              git clone --depth 1 "$REPO" /workspace
              echo "Cloned sigproc repo to /workspace"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
        # ── Stage registry credentials on the writable SMB scratch ─────
        - name: stage-kaniko-creds
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              mkdir -p /kaniko-scratch/.docker
              cp /secret/.dockerconfigjson /kaniko-scratch/.docker/config.json
              chmod 0600 /kaniko-scratch/.docker/config.json
              echo "Staged kaniko docker config"
          volumeMounts:
            - name: kaniko-secret
              mountPath: /secret
              readOnly: true
            - name: kaniko-scratch
              mountPath: /kaniko-scratch
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          # Three sequential builds in one pod: the executor is a binary, and
          # the clone plus scratch volume are worth sharing.
          command:
            - /busybox/sh
            - -c
          args:
            - |
              set -eu
              COMMON="--context=dir:///workspace --cache=true --cache-ttl=24h \
              --snapshot-mode=redo --kaniko-dir=/kaniko-scratch"

              build() {
                echo "=== kaniko: $2 (from $1) ==="
                # shellcheck disable=SC2086
                /kaniko/executor $COMMON --dockerfile="$1" --destination="$2"
              }

              build channelizer/Dockerfile \
                ghcr.io/rodoyle/sigproc-channelizer:latest
              build fixture/Dockerfile ghcr.io/rodoyle/sigproc-fixture:latest
              build sink/Dockerfile ghcr.io/rodoyle/sigproc-sink:latest
              echo "=== all three images pushed ==="
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: kaniko-scratch
              mountPath: /kaniko-scratch
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "3000m"
      volumes:
        - name: workspace
          emptyDir: {}
        - name: kaniko-secret
          secret:
            secretName: ghcr-push
            items:
              - key: .dockerconfigjson
                path: .dockerconfigjson
        - name: kaniko-scratch
          persistentVolumeClaim:
            claimName: kaniko-scratch
