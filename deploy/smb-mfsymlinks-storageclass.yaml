# StorageClass: SMB with client-side symlink emulation.
#
# Why a separate class: kaniko symlinks $KANIKO_DIR/.docker -> /kaniko/.docker,
# and Kubernetes secret volumes always mount via a `..data` symlink. CIFS/SMB
# has no native symlink support, so both fail with
#   "symlink ... operation not supported"
# The `mfsymlinks` mount option makes the CIFS client emulate symlinks as
# regular files, which is transparent to both kaniko and kubelet.
#
# Everything else mirrors the cluster's default `smb` StorageClass.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: smb-mfsymlinks
provisioner: smb.csi.k8s.io
parameters:
  source: //192.168.0.77/pv-store
  csi.storage.k8s.io/provisioner-secret-name: smb-secret
  csi.storage.k8s.io/provisioner-secret-namespace: storage
  csi.storage.k8s.io/node-stage-secret-name: smb-secret
  csi.storage.k8s.io/node-stage-secret-namespace: storage
mountOptions:
  - sec=ntlmssp
  - vers=2.0
  # Emulate POSIX symlinks on CIFS — required for kaniko + secret mounts
  - mfsymlinks
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
