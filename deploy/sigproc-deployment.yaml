# Deployment: sigproc RF front-end on rpi-four-2
# Pins to the node with the B210 USB SDR, runs privileged for USB access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sigproc
  namespace: default
  labels:
    app: sigproc
spec:
  replicas: 1
  # Never surge a second UHD owner while replacing the B210 collector.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sigproc
  template:
    metadata:
      labels:
        app: sigproc
    spec:
      # Pin to the node with the LibreSDR B210
      nodeSelector:
        kubernetes.io/hostname: rpi-four-2
      # USB passthrough: privileged + hostPID for /dev/bus/usb access
      hostPID: true
      # Temporary direct LAN multicast path; no CNI multicast dependency.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        # ghcr.io pull credentials. Must exist in this namespace:
        #   kubectl -n default create secret generic ghcr-pull \
        #     --type=kubernetes.io/dockerconfigjson \
        #     --from-file=.dockerconfigjson=<ghcr-dockerconfigjson>
        # (default/rodoyle-pull-secret only carries quay.io creds, not ghcr.io)
        - name: ghcr-pull
      containers:
        - name: sigproc
          image: ghcr.io/rodoyle/sigproc@sha256:ca518e9e5a14c2e41159c3a78e681af5673c86eb8068315dbb341b9386b8c451  # yamllint disable-line rule:line-length
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9087
              protocol: TCP
          # Hardware initialization precedes HTTP bind. Do not report a newly
          # started container ready while control datagrams are only queued.
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 3
          securityContext:
            privileged: true
          env:
            - name: RUST_LOG
              value: info
            # Config path (default in the binary, explicit here for clarity)
            - name: SIGPROC_CONFIG
              value: /etc/sigproc/config.toml
          volumeMounts:
            - name: config
              mountPath: /etc/sigproc
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: config
          configMap:
            name: sigproc-config
      # Avoid scheduling on nodes without the hardware
      restartPolicy: Always
