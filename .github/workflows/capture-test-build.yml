name: SigProc Capture Image CI
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
permissions:
  contents: read

env:
  DOCKER_BUILDKIT: "1"
  IMAGE: ghcr.io/rodoyle/sigproc-capture
jobs:
  test-build-image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
    - name: Check out source
      uses: actions/checkout@v4
    - name: Test release build and assemble image
      run: |
        docker build \
          --progress=plain \
          --file capture/Dockerfile \
          --tag sigproc:${{ github.sha }} \
          . 
    - name: Log in to GHCR
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push Image
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      run: |
        docker push "$IMAGE:${{ github.sha }}"
        docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
        docker push "$IMAGE:latest"
