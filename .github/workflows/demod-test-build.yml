name: SigProc Demod Image CI
on:
  push:
    branches: ["master"]

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: "1"
  REGISTRY: ghcr.io
  OWNER: rodoyle
  IMAGE: ghcr.io/rodoyle/sigproc-demod

jobs:
  test-build-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compute short SHA
        id: sha
        run: |
          echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "full=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Test release build and assemble image
        env:
          SHA_SHORT: ${{ steps.sha.outputs.short }}
        run: |
          docker build \
            --progress=plain \
            --file capture/Dockerfile \
            --tag $IMAGE:$SHA_SHORT \
            .
      # docker/login-action v3.7.0
      - name: Log in to GHCR
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/master'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/master'
        env:
          SHA_SHORT: ${{ steps.sha.outputs.short }}
        run: |
          docker push "$IMAGE:$SHA_SHORT"
          docker tag "$IMAGE:$SHA_SHORT" "$IMAGE:latest"
          docker push "$IMAGE:latest"
