[package]
name = "sigproc"
version.workspace = true
edition.workspace = true
description = "SDR RF front-end — UHD capture + VITA49 UDP forward for LibreSDR B210"

# The binary name is deliberately still `sigproc`: ghcr.io/rodoyle/sigproc:latest,
# the mounted config path and the live Deployment contract all depend on it.
[[bin]]
name = "sigproc"
path = "src/main.rs"

[features]
# UHD + capture support — requires libuhd-dev, so it is NOT a default feature.
#
# Why opt-in: cargo-chef resolves and cooks the WHOLE workspace, so a default-on
# uhd-support made every service image try to build uhd-sys (and fail without
# libuhd) even though only capture needs it. Opt-in also means
# `cargo test --workspace` now runs on a host with no UHD installed, which is how
# the DSP and wire-format suites are meant to be exercised.
#
default = []
uhd-support = ["dep:uhd", "dep:num-complex"]

[dependencies]
# Shared contracts: VITA49 wire format, config parsing, DSP primitives
sigproc-common = { path = "../common" }

# UHD bindings (optional — gated behind uhd-support feature)
uhd = { version = "0.4", optional = true }
num-complex = { version = "0.4", optional = true }

anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true
